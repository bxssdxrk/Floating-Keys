<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float Keys</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 180px;
            background: #0f0f14;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            padding: 14px;
        }

        h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h1 span.icon {
            font-size: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        label {
            color: rgba(255, 255, 255, 0.65);
        }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
        }

        .toggle input {
            display: none;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle input:checked+.toggle-track {
            background: rgba(100, 170, 255, 0.65);
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
            pointer-events: none;
        }

        .toggle input:checked~.toggle-thumb {
            transform: translateX(16px);
        }

        .hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.5;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 10px;
        }
    </style>
</head>

<body>
    <h1><span class="icon">⌨️</span> Float Keys</h1>

    <div class="row">
        <label>Mostrar widget</label>
        <label class="toggle">
            <input type="checkbox" id="toggle-visible" checked />
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
        </label>
    </div>

    <p class="hint">Arraste pelo ponto acima das teclas para reposicionar.</p>

    <script src="popup.js"></script>
</body>

</html>
